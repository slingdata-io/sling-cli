name: skills project layout, build structure, secrets boundary
seed: home_with_claude
timeout_s: 40
order:
  - run: sling assist setup --non-interactive --agent claude
  - wait_for: "Wired clients:"

assert_files:
  - path: "$HOME/.agents/skills/agent-browser/SKILL.md"
    contains:
      - "sling assist setup"
      - "CORE.md"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/agent-browser/CORE.md"
    contains:
      - "The core loop"
      - "agent-browser snapshot"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-project/SKILL.md"
    contains:
      - "State-probe"
      - "stg_<source>__<entity>"
      - "sling parse ./ --check"
      - "replicate → build → check → log"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-project/STRUCTURE.md"
    contains:
      - "Macro promotion"
      - "Do not add a `raw/` model folder"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-build/STRUCTURE.md"
    contains:
      - "Names are global"
      - "1st folder level is the schema name"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-connections/SKILL.md"
    contains:
      - "Never ask for credentials in chat"
      - "Never `cat` or read env.yaml"
      - "test → sanitized error → user edits → retest"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-replications/SKILL.md"
    contains:
      - "## Hooks"
      - "target `raw_*` schemas only"
    md5_matches_embedded: true
  - path: "$HOME/.agents/skills/sling-pipelines/SKILL.md"
    contains:
      - "replicate → build → check → log"
      - "Do not use `notify`"
    md5_matches_embedded: true
