# Eval sandbox connections. Host values overlay these stubs at seed time.
connections:
  POSTGRES:
    type: postgres
    url: postgresql://eval:eval@127.0.0.1:1/eval
  MYSQL:
    type: mysql
    url: mysql://eval:eval@127.0.0.1:1/eval
  CLICKHOUSE:
    type: clickhouse
    url: clickhouse://eval:eval@127.0.0.1:1/eval
  DUCKDB:
    type: duckdb
    instance: eval.duckdb
  SQLITE:
    type: sqlite
    url: sqlite://eval.db
  LOCAL:
    type: local
    url: file://.
  AWS_S3_TEST:
    type: s3
    bucket: sling-eval
    access_key_id: eval
    secret_access_key: eval
  MOCK_API:
    type: api
    spec: fixtures/data/mock_api.yaml
    secrets:
      token: eval-token
      oauth_client_id: eval-client
      oauth_client_secret: eval-secret
      base_url: http://127.0.0.1:9
env:
  SLING_ASSIST:
    agent: codex
    hint_in_errors: true
    prompt_style: concise
