id: e.06.repl_local_mysql_glob
task: replication_create
tier: core
gating: true
tags: [replication]
intention: >
  Create a replication from LOCAL to MYSQL that loads fixtures/data/*.csv
  in truncate mode. Write ./csv_load.yaml. Do not run it unless asked.
arms: [claude, grok, opencode2, codex]
conns: [LOCAL, MYSQL]
artifact: csv_load.yaml
graders:
  required:
    - file_exists: "{artifact}"
    - yaml_valid: "{artifact}"
    - sling: replication parse {artifact}
    - sling: replication compile {artifact}
    - expected:
        file: expected.yaml
        compare: compiled
        must_match:
          - source
          - target
          - streams.*.mode
    - outcome:
        run: sling run -r {artifact}
        checks:
          - file_exists: "{artifact}"
