id: e.10.repl_update_incremental
task: replication_update
tier: core
gating: true
tags: [replication]
intention: >
  Update the replication at orders_repl.yaml: change full-refresh to incremental
  and add update key updated_at. Do not change other streams.
edit_path: orders_repl.yaml
arms: [claude, grok, opencode2, codex]
conns: [POSTGRES, DUCKDB]
artifact: orders_repl.yaml
graders:
  required:
    - file_exists: "{artifact}"
    - yaml_valid: "{artifact}"
    - sling: replication parse {artifact}
    - sling: replication compile {artifact}
    - expected:
        file: expected.yaml
        compare: compiled
        must_match:
          - streams.*.mode
          - streams.*.update_key
        must_not_exist:
          - streams.public.customers
    - dry_run: SLING_DRY_RUN=true sling run -r {artifact}
