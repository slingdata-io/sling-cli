- id: 439
  name: 'sling build serializes independent DuckDB roots'
  env:
    DUCK_PARALLEL: '{type: duckdb, instance: "temp/duckdb_parallel/test.duckdb"}'
  run: |
    mkdir -p temp/duckdb_parallel
    rm -f temp/duckdb_parallel/test.duckdb
    sling build tests/build/duckdb_parallel_project --target DUCK_PARALLEL --full-refresh --threads 4
  group: build
  output_contains:
    - 'OK'
    - 'Build Completed'
  output_does_not_contain:
    - 'Conflicting lock'
    - 'Could not set lock'


