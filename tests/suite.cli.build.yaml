      toString(countIf(query LIKE 'CREATE TABLE%_sling_build_tmp_ch_set_full_%PARTITION BY toYYYYMM(event_day) PRIMARY KEY event_day ORDER BY (event_day, id) TTL%') > 0)) AS c
      FROM system.query_log WHERE type = 'QueryFinish' AND query_kind = 'Create' AND log_comment = 'sling_settings_test' AND event_time > now() - INTERVAL 15 MINUTE"
  output_contains:
