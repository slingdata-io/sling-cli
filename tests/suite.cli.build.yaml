# expanded BuildDefaults — layered schema, additive tags/hooks,
# enabled:false skip, defaults unique_key/update_key/merge_strategy.

- id: 424
  name: 'sling build --compile defaults_expanded_project layers defaults'
  group: build
  run: 'sling build tests/build/defaults_expanded_project --compile --target POSTGRES --recursive'
  output_contains:
    # stg_orders inherits root defaults.schema=raw (overrides folder schema)
    - 'table: raw.stg_orders'
    # child defaults.mode + unique_key + update_key + merge_strategy apply
    - 'mode: incremental'
    - 'unique_key: id'
    - 'update_key: updated_at'
    - 'merge_strategy: delete+insert'
    # root tag + child tag — union+dedupe
    - 'tags: [core, staging]'
    # root defaults hook inherited into stg_orders
    - '"message":"default start hook"'
    # fct_orders: schema override propagates, frontmatter merges with root defaults
    - 'table: raw.fct_orders'
    - 'tags: [core, marts]'
    - '"message":"fct_orders frontmatter start hook"'
    # ref() rewrite uses overridden schema
    - 'FROM raw.stg_orders'
    - 'dependencies: [stg_orders]'
  output_does_not_contain:
    # enabled:false model must be absent from compile output
    - 'stg_disabled'

