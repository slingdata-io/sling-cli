    - 'Build Completed'
    - 'chk:tr_set_plain'

# The memory catalog has no table properties, so the server rejects the WITH clause. This proves it reaches the server.
- id: 907
  name: 'sling build trino WITH clause reaches the server'
  group: build
  after: [906]
  err: true
  run: 'sling build run tests/build/trino_settings_bad_project --target TRINO --full-refresh -s tr_set_bad -d'
  output_contains:
    - "WITH (format = 'PARQUET')"
    - 'does not exist'

- id: 908
  name: 'sling build trino cleanup'
  group: build
  after: [907]
  run: |
    SLING_ROW_CNT= sling conns exec TRINO "DROP TABLE IF EXISTS memory.sling_build_trino.tr_set_plain"
    sling conns exec TRINO "DROP SCHEMA IF EXISTS memory.sling_build_trino"
  output_contains:
    - 'successful!'

- id: 909
  name: 'sling build starrocks table properties (no rename, drop then CTAS)'
  group: build
  run: |
    SLING_ROW_CNT= sling conns exec STARROCKS "CREATE DATABASE IF NOT EXISTS sling_build_sr"
    SLING_ROW_CNT= sling conns exec STARROCKS "DROP TABLE IF EXISTS sling_build_sr.sr_set_plain FORCE"
    SLING_ROW_CNT= sling conns exec STARROCKS "DROP TABLE IF EXISTS sling_build_sr.sr_set_full FORCE"
    sling build run tests/build/starrocks_settings_project --target STARROCKS --full-refresh
  output_contains:
    - 'Build Completed'

- id: 910
  name: 'sling build starrocks table properties show in the catalog'
  group: build
  after: [909]
  run: |
    sling conns exec STARROCKS "SELECT concat('chk:', properties) AS c FROM information_schema.tables_config WHERE table_schema = 'sling_build_sr' AND table_name = 'sr_set_full'"
  output_contains:
    - '"compression":"ZSTD"'

- id: 911
  name: 'sling build starrocks cleanup'
  group: build
  after: [910]
  run: 'sling conns exec STARROCKS "DROP DATABASE IF EXISTS sling_build_sr FORCE"'
  output_contains:
    - 'successful!'
