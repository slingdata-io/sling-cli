- id: 876
  name: 'sling build clickhouse query settings reach each statement and do not leak'
  group: build
  after: [875]
  run: |
    SLING_ROW_CNT= sling conns exec CLICKHOUSE "SYSTEM FLUSH LOGS"
    # "sling conns exec" runs a query with the word "insert" as a statement (no rows shown), so k builds the word
    sling conns exec CLICKHOUSE "WITH concat('ins', 'ert') AS k SELECT concat('chk:',
      toString(countIf(query_kind = 'Create' AND query LIKE '%_sling_build_tmp_ch_set_inc_%' AND Settings.Values[indexOf(Settings.Names, 'max_threads')] = '3') > 0), '|',
      toString(countIf(query_kind = 'Alter' AND query LIKE '%ch_set_inc%DELETE%' AND Settings.Values[indexOf(Settings.Names, 'max_threads')] = '3') > 0), '|',
      toString(countIf(lower(query_kind) = k AND lower(query) LIKE concat(k, ' into%ch_set_inc%') AND Settings.Values[indexOf(Settings.Names, 'max_threads')] = '3') > 0), '|',
      toString(countIf(lower(query_kind) = k AND lower(query) LIKE concat(k, ' into%ch_set_append%') AND Settings.Values[indexOf(Settings.Names, concat('max_', k, '_threads'))] = '2') > 0), '|',
      toString(countIf(lower(query_kind) = k AND lower(query) LIKE concat(k, ' into%ch_set_trunc%') AND Settings.Values[indexOf(Settings.Names, 'max_threads')] = '2') > 0), '|',
      toString(countIf(query LIKE '%ch_set_full%' AND has(Settings.Names, 'max_threads')) = 0)) AS c
      FROM system.query_log WHERE type = 'QueryFinish' AND log_comment = 'sling_settings_test' AND event_time > now() - INTERVAL 15 MINUTE"
    sling conns exec CLICKHOUSE "SELECT concat('ms:', Settings.Values[indexOf(Settings.Names, 'mutations_sync')]) AS c FROM system.query_log WHERE type = 'QueryFinish' AND query_kind = 'Alter' AND query LIKE '%ch_set_inc%DELETE%' AND log_comment = 'sling_settings_test' ORDER BY event_time DESC LIMIT 1"
  output_contains:
    - 'chk:1|1|1|1|1|1'

- id: 877
