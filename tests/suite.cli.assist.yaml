- id: 297
  name: 'sling run failure writes log snapshot + AI hint'
  group: assist
  err: true
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude >/dev/null 2>&1
    # Intentionally broken replication so `sling run` fails quickly.
    cat > "$H/bad.yaml" <<'EOF'
    source: __no_such_conn__
    target: __no_such_conn__
    streams:
      public.x:
        object: public.x
    EOF
    # Leave stderr unredirected so the suite can assert on the AI hint; the
    # script still fails (set -e) if the snapshot files are missing.
    set +e
    HOME="$H" SLING_HOME_DIR="$H/.sling" SLING_EXEC_ID=exec_assist_test297 \
      sling run -r "$H/bad.yaml"
    run_rc=$?
    set -e
    test -f "$H/.sling/assist/errors/executions/exec_assist_test297/error.txt"
    test -f "$H/.sling/assist/errors/executions/exec_assist_test297/meta.json"
    grep -q error_signature "$H/.sling/assist/errors/executions/exec_assist_test297/meta.json"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist --out -
    rm -rf "$H"
    # Propagate the failed-run exit so suite.err:true is satisfied.
    exit $run_rc
  output_contains:
    - 'error signature:'
    - 'failed run'
    - 'exec_assist_test297'

