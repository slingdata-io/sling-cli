

- id: 290
  name: 'sling assist setup --non-interactive (headless)'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude
    test -f "$H/.agents/skills/sling/SKILL.md"
    test -f "$H/.agents/skills/agent-browser/SKILL.md"
    test -f "$H/.agents/skills/agent-browser/CORE.md"
    test -f "$H/.claude/skills/sling/SKILL.md"
    test -f "$H/.claude.json"
    grep -q 'agent-browser' "$H/.claude.json"
    grep -q 'agent: claude' "$H/.sling/env.yaml"
    rm -rf "$H"
  output_contains:
    - 'Wired clients:'
    - 'claude'
    - 'sling assist setup --doctor'

- id: 291
  name: 'sling assist setup --doctor exits non-zero when nothing installed'
  group: assist
  err: true
  run: |
    H=$(mktemp -d)
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist setup --doctor
    rm -rf "$H"
  output_contains:
    - 'profile'

- id: 292
  name: 'sling assist --out - renders prompt without launching'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude >/dev/null 2>&1
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist --out - \
      "Create a replication from PG to SF for public.users in full-refresh mode."
