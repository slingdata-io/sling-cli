- id: 298
  name: 'uninstall stamp prevents AutoRefresh resurrection'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude >/dev/null 2>&1
    test -f "$H/.agents/skills/sling/SKILL.md"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist setup --uninstall >/dev/null 2>&1
    test ! -d "$H/.agents/skills/sling"
    # Stamp must be "uninstalled" so a fake older binary version does not reinstall.
    grep -qx uninstalled "$H/.sling/assist/version"
    # Touch a bogus old stamp scenario: rewrite stamp to old, but uninstall
    # already set uninstalled; after re-uninstall stamp stays uninstalled.
    # Simulate upgrade path: write old version then ensure doctor/history still no-ops refresh.
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist setup --doctor >/dev/null || true
    test ! -d "$H/.agents/skills/sling"
    rm -rf "$H"
  output_contains: []

- id: 323
  name: 'sling assist auto-heals drifted skills on every command'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude >/dev/null 2>&1
    echo drifted-content > "$H/.agents/skills/sling/SKILL.md"
    echo drifted-content > "$H/.agents/skills/sling-build/SKILL.md"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist setup --doctor
    grep -qv drifted-content "$H/.agents/skills/sling/SKILL.md"
    grep -qv drifted-content "$H/.agents/skills/sling-build/SKILL.md"
    rm -rf "$H"
  output_contains:
    - '✓ skills: sling matches embedded'
  output_does_not_contain:
    - 'drifted from embedded'

- id: 299
  name: 'sling assist --resume --out - restores saved prompt'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude" "$H/.sling/assist/history/2026-01-01_00-00-00_assist"
    cat > "$H/.sling/assist/history/2026-01-01_00-00-00_assist/answers.yaml" <<'EOF'
    schema_version: 1
    name: assist
    task: ask
    created: 2026-01-01T00:00:00Z
    agent: claude
    cwd: /tmp
    answers:
      ask: backfill orders
    EOF
    echo 'saved prompt: backfill orders' > "$H/.sling/assist/history/2026-01-01_00-00-00_assist/prompt.md"
    echo '{"id":"2026-01-01_00-00-00_assist","agent":"claude","harness_session_id":"abc"}' > "$H/.sling/assist/history/2026-01-01_00-00-00_assist/meta.json"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist --resume 2026-01-01_00-00-00_assist --out -
    rm -rf "$H"
  output_contains:
    - 'saved prompt: backfill orders'

- id: 324
  name: 'sling assist setup wires agent-browser MCP and skill'
  group: assist
  run: |
    H=$(mktemp -d)
    mkdir -p "$H/.claude"
    HOME="$H" SLING_HOME_DIR="$H/.sling" AGENT_BROWSER_SKIP_DOWNLOAD=1 sling assist setup --non-interactive --agent claude
    grep -q 'agent-browser' "$H/.claude.json"
    grep -q '"mcp"' "$H/.claude.json" || grep -q 'mcpServers' "$H/.claude.json"
    test -f "$H/.agents/skills/agent-browser/SKILL.md"
    test -f "$H/.agents/skills/agent-browser/CORE.md"
    grep -q 'agent-browser' "$H/.agents/skills/agent-browser/SKILL.md"
    rm -rf "$H"
  output_contains:
    - 'Wired clients:'
    - 'claude'
- id: 325
  name: 'sling assist --exec investigates a failed run with its log'
  group: assist
  run: |
    H=$(mktemp -d)
    cat > "$H/bad.yaml" <<'YAML'
    source: local
    target: local
    defaults:
      mode: full-refresh
    streams:
      "file:///nonexistent/path/*.csv":
        object: "file:///tmp/out.csv"
    YAML
    set +e
    HOME="$H" SLING_HOME_DIR="$H/.sling" SLING_EXEC_ID=exec_suite325 \
      sling run --debug -r "$H/bad.yaml"
    set -e
    # The run log is captured, not just the error text.
    test -f "$H/.sling/assist/errors/executions/exec_suite325/stderr.log"
    grep -q 'execution failed' "$H/.sling/assist/errors/executions/exec_suite325/stderr.log"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist --exec exec_suite325 --out -
    rm -rf "$H"
  output_contains:
    - 'error signature:'
    - 'run log (tail):'
    - 'Investigate the failed run exec_suite325'

- id: 326
  name: 'sling assist --id rejects unknown execution id'
  group: assist
  err: true
  run: |
    H=$(mktemp -d)
    unset SLING_PROJECT_TOKEN
    HOME="$H" SLING_HOME_DIR="$H/.sling" SLING_PROJECT_TOKEN='' sling assist --id no_such_exec --out -
    rm -rf "$H"
  output_contains:
    - 'unknown exec id'

- id: 329
  name: 'sling assist report --id prints redacted draft'
  group: assist
  run: |
    H=$(mktemp -d)
    D="$H/.sling/assist/errors/executions/exec_report329"
    mkdir -p "$D"
    cat > "$D/meta.json" <<'EOF'
    {"exec_id":"exec_report329","exit_code":1,"error_short_label":"no_stream_columns","source_type":"postgres","target_type":"snowflake","object":"/Users/alice/secret.yaml"}
    EOF
    printf '%s\n' 'failed to read /Users/alice/secret.yaml' > "$D/error.txt"
    printf '%s\n' 'opened https://db.internal.example.com/x' 'path=/Users/alice/secret.yaml' > "$D/stderr.log"
    HOME="$H" SLING_HOME_DIR="$H/.sling" sling assist report --id exec_report329
    rm -rf "$H"
  output_contains:
    - 'no_stream_columns'
    - '<path>'
    - '## Description'
    - '## Replication Configuration'
    - '## Log Output'
  output_does_not_contain:
    - '/Users/'

