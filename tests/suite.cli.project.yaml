- id: 530
  name: 'sling init succeeds with no token'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    unset SLING_CLI_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - sling_project.yml
    - models/sling_build.yml
  output_does_not_contain:
    - invalid project token
    - did not provide the SLING_PROJECT_TOKEN

- id: 531
  name: 'sling init succeeds with leftover token and no network'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    sling init --target POSTGRES --source SQLITE --yes
  env:
    SLING_PROJECT_TOKEN: dummy-token-must-not-call-network
    SLING_CLI_TOKEN: ''
    HTTPS_PROXY: 'http://127.0.0.1:1'
    HTTP_PROXY: 'http://127.0.0.1:1'
    SLING_PLATFORM_HOST: 'https://127.0.0.1:1'
  output_contains:
    - sling_project.yml
    - sling platform jobs list
  output_does_not_contain:
    - invalid project token
    - error validating project token

- id: 532
  name: 'sling init non-interactive writes canonical layout'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    test -f sling_project.yml
    test -f models/sling_build.yml
    test -f pipelines/daily.yaml
    test -f replications/sqlite.yaml
    test -f models/staging/stg_sqlite__example.sql
    test -f models/marts/fct_example.sql
    echo "SUCCESS: canonical layout"
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'SUCCESS: canonical layout'
    - sling_project.yml

- id: 534
  name: 'sling validate succeeds on scaffolded pipeline'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    sling validate pipelines/daily.yaml --json
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - '"kind": "pipeline"'
    - '"ok": true'
    - daily.yaml

- id: 535
  name: 'sling platform status without a token fails fast'
  err: true
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    sling init --target POSTGRES --source SQLITE --yes
    sling platform status
  env:
    SLING_PROJECT_TOKEN: ''
    SLING_PROJECT_ID: ''
    SLING_PROJECT_PATH: ''
  output_contains:
    - SLING_PROJECT_TOKEN
  output_does_not_contain:
    - Last Run
    - Project Root

