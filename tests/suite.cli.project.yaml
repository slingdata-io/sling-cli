- id: 561
  name: 'sling run -j applies the job streams and mode'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    printf 'id,name\n1,alpha\n' > alpha.csv
    printf 'id,name\n2,beta\n' > beta.csv
    printf 'source: LOCAL\ntarget: SQLITE\ndefaults:\n  mode: full-refresh\nstreams:\n  file://alpha.csv:\n    object: main.job_alpha\n  file://beta.csv:\n    object: main.job_beta\n' > replications/local.yaml
    printf 'name: jobdemo\njobs:\n  onlyalpha:\n    file: replications/local.yaml\n    streams: ["file://alpha.csv"]\n    mode: truncate\n' > sling_project.yml
    sling run -j onlyalpha -d
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'job_alpha'
    - 'full-refresh => truncate'
    - 'file://alpha.csv'
  output_does_not_contain:
    - 'job_beta'
    - 'file://beta.csv'

- id: 562
  name: 'sling run <key> resolves a bare manifest key'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    printf 'id,name\n1,alpha\n' > alpha.csv
    printf 'source: LOCAL\ntarget: SQLITE\ndefaults:\n  mode: full-refresh\nstreams:\n  file://alpha.csv:\n    object: main.bare_key\n' > replications/local.yaml
    printf 'name: jobdemo\njobs:\n  loadit:\n    file: replications/local.yaml\n    mode: truncate\n' > sling_project.yml
    sling run loadit -d
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'bare_key'
    - 'full-refresh => truncate'

- id: 563
  name: 'a file path shadowing a job key wins over the key'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    printf 'id,name\n1,alpha\n' > alpha.csv
    printf 'source: LOCAL\ntarget: SQLITE\nstreams:\n  file://alpha.csv:\n    object: main.from_key\n' > replications/local.yaml
    printf 'source: LOCAL\ntarget: SQLITE\nstreams:\n  file://alpha.csv:\n    object: main.from_path\n' > loadit
    printf 'name: jobdemo\njobs:\n  loadit:\n    file: replications/local.yaml\n    mode: truncate\n' > sling_project.yml
    sling run loadit -d
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'from_path'
  output_does_not_contain:
    - 'from_key'
    - 'full-refresh => truncate'

- id: 564
  name: 'sling run -j with a missing key lists the available keys'
  err: true
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    printf 'jobs:\n  daily:\n    file: pipelines/daily.yaml\n  hourly:\n    file: pipelines/daily.yaml\n' >> sling_project.yml
    sling run -j nope
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'is not in the manifest'
    - 'daily'
    - 'hourly'

- id: 566
  name: 'sling run -p --env overrides the pipeline env block'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    printf 'env:\n  WHO: fromfile\nsteps:\n  - type: log\n    message: "who={env.WHO}"\n' > p.yaml
    sling run -p p.yaml --env '{"WHO":"fromcli"}'
  env:
    SLING_PROJECT_TOKEN: ''
    SLING_PROJECT_ID: ''
  output_contains:
    - 'who=fromcli'
  output_does_not_contain:
    - 'who=fromfile'
    - 'who={env.WHO}'

- id: 565
  name: 'sling run -j applies job variables to a pipeline'
  run: |
    DIR=$(mktemp -d)
    cd "$DIR"
    unset SLING_PROJECT_TOKEN
    sling init --target POSTGRES --source SQLITE --yes
    printf 'steps:\n  - type: log\n    message: "who={env.WHO} where={env.WHERE}"\n' > pipelines/daily.yaml
    printf 'name: jobdemo\njobs:\n  greet:\n    file: pipelines/daily.yaml\n    variables:\n      WHO: sling\n      WHERE: here\n' > sling_project.yml
    sling run -j greet -d
  env:
    SLING_PROJECT_TOKEN: ''
  output_contains:
    - 'who=sling where=here'
