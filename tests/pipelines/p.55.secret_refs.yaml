# Secret references: an env: value that is a reference resolves at load,
# secret() resolves in an expression, and log output hides the values.
env:
  TOKEN_793: ref+exec://echo?arg=pipeline-secret-793

steps:
  - type: log
    message: 'token is {env.TOKEN_793}'

  - type: check
    check: env.TOKEN_793 == "pipeline-secret-793"

  - type: check
    check: secret("ref+exec://echo?arg=fn-secret-793") == "fn-secret-793"

  - type: log
    message: 'secret checks passed'
