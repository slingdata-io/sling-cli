# GH #759: Oracle DB-to-DB with use_bulk=false must keep non-ASCII text.
# Source (AL32UTF8 PDB): U+00E9 U+00C0 in VARCHAR2, NVARCHAR2 and CLOB.
# Targets: a WE8ISO8859P1 PDB (the defect) and the AL32UTF8 PDB (no regression).
# run_docker_test.sh sets ORACLE_GH759 and ORACLE_GH759_WE8.

steps:
  - type: query
    connection: ORACLE_GH759
    query: "begin execute immediate 'drop table GH759_SRC purge'; exception when others then null; end;"

  - type: query
    connection: ORACLE_GH759
    query: create table GH759_SRC (id number, txt varchar2(20 char), ntxt nvarchar2(20), ctxt clob)

  - type: query
    connection: ORACLE_GH759
    query: insert into GH759_SRC values (1, unistr('\00E9\00C0'), unistr('\00E9\00C0'), unistr('\00E9\00C0'))

  # 1. WE8ISO8859P1 target
  - type: query
    connection: ORACLE_GH759_WE8
    query: "begin execute immediate 'drop table GH759_TGT purge'; exception when others then null; end;"

  - type: replication
    path: tests/pipelines/gh759_oracle_nonbulk_utf8/r.gh759_to_we8.yaml

  - type: query
    connection: ORACLE_GH759_WE8
    query: |
      select asciistr(txt) a_txt, asciistr(ntxt) a_ntxt, asciistr(to_char(ctxt)) a_ctxt,
             case when asciistr(txt) = '\00E9\00C0' then 'OK' else 'BAD' end txt_ok,
             case when asciistr(ntxt) = '\00E9\00C0' then 'OK' else 'BAD' end ntxt_ok,
             case when asciistr(to_char(ctxt)) = '\00E9\00C0' then 'OK' else 'BAD' end ctxt_ok
      from GH759_TGT
    into: we8

  - type: log
    message: 'GH759 WE8 TARGET {store.we8}'

  - type: query
    connection: ORACLE_GH759_WE8
    query: select column_name, data_type from user_tab_columns where table_name = 'GH759_TGT' order by column_id
    into: we8_cols

  - type: log
    message: 'GH759 WE8 TARGET COLUMNS {store.we8_cols}'

  - type: check
    check: store.we8[0].txt_ok == "OK" && store.we8[0].ntxt_ok == "OK" && store.we8[0].ctxt_ok == "OK"
    failure_message: 'GH759 WE8 target corrupted: {store.we8}'

  - type: log
    message: 'GH759 WE8 target OK'

  # 2. AL32UTF8 target (same PDB as the source)
  - type: query
    connection: ORACLE_GH759
    query: "begin execute immediate 'drop table GH759_TGT purge'; exception when others then null; end;"

  - type: replication
    path: tests/pipelines/gh759_oracle_nonbulk_utf8/r.gh759_to_utf8.yaml

  - type: query
    connection: ORACLE_GH759
    query: |
      select case when asciistr(txt) = '\00E9\00C0' then 'OK' else 'BAD' end txt_ok,
             case when asciistr(ntxt) = '\00E9\00C0' then 'OK' else 'BAD' end ntxt_ok,
             case when asciistr(to_char(ctxt)) = '\00E9\00C0' then 'OK' else 'BAD' end ctxt_ok
      from GH759_TGT
    into: utf8

  - type: check
    check: store.utf8[0].txt_ok == "OK" && store.utf8[0].ntxt_ok == "OK" && store.utf8[0].ctxt_ok == "OK"
    failure_message: 'GH759 AL32UTF8 target corrupted: {store.utf8}'

  - type: log
    message: 'GH759 AL32UTF8 target OK'

  # 3. WE8ISO8859P1 target that exists with NVARCHAR2/NCLOB columns (SLING-207).
  # U+0142 is not in WE8ISO8859P1, so only the national charset holds it.
  - type: query
    connection: ORACLE_GH759
    query: "begin execute immediate 'drop table GH759_NSRC purge'; exception when others then null; end;"

  - type: query
    connection: ORACLE_GH759
    query: create table GH759_NSRC (id number, ntxt varchar2(20 char), nctxt clob)

  - type: query
    connection: ORACLE_GH759
    query: |
      declare c clob;
      begin
        for i in 1..20 loop c := c || rpad(unistr('\0142'), 2000, unistr('\0142')); end loop;
        insert into GH759_NSRC values (1, unistr('\0142\00E9'), c);
        commit;
      end;

  - type: query
    connection: ORACLE_GH759_WE8
    query: "begin execute immediate 'drop table GH759_NTGT purge'; exception when others then null; end;"

  - type: query
    connection: ORACLE_GH759_WE8
    query: create table GH759_NTGT (id number, ntxt nvarchar2(20), nctxt nclob)

  - type: group
    id: ntypes
    loop: [ 'r.gh759_to_we8_ntypes.yaml', 'r.gh759_to_we8_ntypes_direct.yaml' ]
    steps:
      - type: replication
        path: 'tests/pipelines/gh759_oracle_nonbulk_utf8/{loop.value}'

      - type: query
        connection: ORACLE_GH759_WE8
        query: |
          select case when count(*) = 1 then 'OK' else 'BAD' end cnt_ok, max(asciistr(ntxt)) a_ntxt, max(dbms_lob.getlength(nctxt)) nc_len,
                 case when max(asciistr(ntxt)) = '\0142\00E9' then 'OK' else 'BAD' end ntxt_ok,
                 case when max(dbms_lob.getlength(nctxt)) = 40000
                       and max(dbms_lob.substr(nctxt, 1000, 1)) = rpad(unistr('\0142'), 1000, unistr('\0142'))
                       and max(dbms_lob.substr(nctxt, 1000, 39001)) = rpad(unistr('\0142'), 1000, unistr('\0142'))
                      then 'OK' else 'BAD' end nctxt_ok
          from GH759_NTGT
        into: ntgt

      - type: log
        message: 'GH759 WE8 N-TYPES {loop.value} {store.ntgt}'

      - type: check
        check: store.ntgt[0].cnt_ok == "OK" && store.ntgt[0].ntxt_ok == "OK" && store.ntgt[0].nctxt_ok == "OK"
        failure_message: 'GH759 WE8 N-type target corrupted ({loop.value}): {store.ntgt}'

  - type: log
    message: 'GH759 WE8 N-type target OK'

  - type: log
    message: 'GH759 non-bulk non-ASCII test PASSED'
