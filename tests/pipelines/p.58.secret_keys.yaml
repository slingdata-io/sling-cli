# Log output hides resolved values of secret keys only: a database name shows,
# a password or URL is ***.
env:
  DB_NAME_808: ref+exec://echo?arg=odoo-db-808
  DB_PASSWORD_808: ref+exec://echo?arg=odoo-pass-808
  DB_URL_808: ref+exec://echo?arg=https://odoo-808.example.com

steps:
  - type: log
    message: 'database is {env.DB_NAME_808}'

  - type: log
    message: 'password is {env.DB_PASSWORD_808}'

  - type: log
    message: 'url is {env.DB_URL_808}'

  - type: check
    check: env.DB_PASSWORD_808 == "odoo-pass-808"

  - type: log
    message: 'secret key checks passed'
