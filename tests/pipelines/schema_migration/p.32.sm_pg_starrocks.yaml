# Schema Migration Comprehensive Test: PostgreSQL to StarRocks
# Tests: primary keys, auto-increment, defaults, nullable, indexes, foreign keys, descriptions
# StarRocks notes:
#   - Primary keys make Primary Key tables (no _sling_row_id column)
#   - AUTO_INCREMENT only on BIGINT columns
#   - DEFAULT only accepts quoted literals, CURRENT_TIMESTAMP and (uuid()); CURRENT_DATE is dropped
#   - Indexes are single-column BITMAP indexes (multi-column indexes are skipped)
#   - Foreign keys are informational (table property foreign_key_constraints)
#   - No UNIQUE column constraint

env:
  SOURCE: postgres
  TARGET: starrocks

steps:
  # Clean up target first
  - connection: '{env.TARGET}'
    query: |
      DROP TABLE IF EXISTS public.sm_order_items;
      DROP TABLE IF EXISTS public.sm_orders;
      DROP TABLE IF EXISTS public.sm_products;
      DROP TABLE IF EXISTS public.sm_customers;
      DROP TABLE IF EXISTS public.sm_categories;

  # Clean up source
  - connection: '{env.SOURCE}'
    query: |
      DROP TABLE IF EXISTS public.sm_order_items CASCADE;
      DROP TABLE IF EXISTS public.sm_orders CASCADE;
      DROP TABLE IF EXISTS public.sm_products CASCADE;
      DROP TABLE IF EXISTS public.sm_customers CASCADE;
      DROP TABLE IF EXISTS public.sm_categories CASCADE;

  # Create source tables with all schema attributes
  - connection: '{env.SOURCE}'
    query: |
      -- Table 1: sm_categories (no FKs, referenced by sm_products)
      CREATE TABLE public.sm_categories (
        cat_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        cat_name VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        is_active BOOLEAN DEFAULT TRUE
      );

      -- Table 2: sm_customers (no FKs, referenced by sm_orders)
      CREATE TABLE public.sm_customers (
        customer_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        email VARCHAR(255) NOT NULL UNIQUE,
        full_name VARCHAR(200) NULL,
        phone VARCHAR(50) NULL,
        external_id UUID DEFAULT gen_random_uuid(),
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        signup_date DATE DEFAULT CURRENT_DATE
      );

      -- Table 3: sm_products (FK to sm_categories)
      CREATE TABLE public.sm_products (
        product_id BIGINT GENERATED BY DEFAULT AS IDENTITY (START WITH 100) PRIMARY KEY,
        category_id BIGINT NOT NULL,
        product_name VARCHAR(200) NOT NULL,
        price DECIMAL(10,2) DEFAULT 0.00,
        stock_qty INT DEFAULT 0,
        CONSTRAINT fk_products_category FOREIGN KEY (category_id) REFERENCES public.sm_categories(cat_id)
      );

      -- Table 4: sm_orders (FK to sm_customers)
      CREATE TABLE public.sm_orders (
        order_id BIGINT GENERATED BY DEFAULT AS IDENTITY (START WITH 1000 INCREMENT BY 10) PRIMARY KEY,
        customer_id BIGINT NOT NULL,
        order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        status VARCHAR(50) DEFAULT 'pending',
        CONSTRAINT fk_orders_customer FOREIGN KEY (customer_id) REFERENCES public.sm_customers(customer_id)
      );

      -- Table 5: sm_order_items (FKs to sm_orders and sm_products)
      CREATE TABLE public.sm_order_items (
        item_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        order_id BIGINT NOT NULL,
        product_id BIGINT NOT NULL,
        quantity INT DEFAULT 1,
        CONSTRAINT fk_items_order FOREIGN KEY (order_id) REFERENCES public.sm_orders(order_id),
        CONSTRAINT fk_items_product FOREIGN KEY (product_id) REFERENCES public.sm_products(product_id)
      );

      -- Indexes (the multi-column index is skipped on StarRocks)
      CREATE INDEX idx_src_products_category ON public.sm_products (category_id);
      CREATE INDEX idx_src_orders_customer ON public.sm_orders (customer_id);
      CREATE INDEX idx_src_items_order_product ON public.sm_order_items (order_id, product_id);

  # Add descriptions (column and table)
  - connection: '{env.SOURCE}'
    query: |
      COMMENT ON COLUMN public.sm_categories.cat_name IS 'Category name for products';
      COMMENT ON COLUMN public.sm_customers.email IS 'Customer''s email address';
      COMMENT ON COLUMN public.sm_orders.status IS 'Order status: pending, shipped, delivered';
      COMMENT ON TABLE public.sm_categories IS 'Product categories lookup table';
      COMMENT ON TABLE public.sm_customers IS 'Customer master data';

  # Insert test data
  - connection: '{env.SOURCE}'
    query: |
      INSERT INTO public.sm_categories (cat_name) VALUES ('Electronics'), ('Clothing');
      INSERT INTO public.sm_customers (email, full_name, phone) VALUES ('test@example.com', 'Test User', '555-1234'), ('user2@example.com', NULL, NULL);
      INSERT INTO public.sm_products (category_id, product_name, price, stock_qty) VALUES (1, 'Laptop', 999.99, 10), (2, 'T-Shirt', 29.99, 100);
      INSERT INTO public.sm_orders (customer_id, status) VALUES (1, 'shipped'), (2, 'pending');
      INSERT INTO public.sm_order_items (order_id, product_id, quantity) VALUES (1000, 100, 2), (1010, 101, 3);

  - replication:
      source: '{ env.SOURCE }'
      target: '{ env.TARGET }'

      env:
        SLING_SCHEMA_MIGRATION: all

      defaults:
        mode: full-refresh

      # Streams listed in WRONG topological order to test FK reordering
      # Correct order: sm_categories, sm_customers, sm_products, sm_orders, sm_order_items
      streams:
        public.sm_order_items:
          object: public.sm_order_items

        public.sm_orders:
          object: public.sm_orders

        public.sm_products:
          object: public.sm_products

        public.sm_categories:
          object: public.sm_categories

        public.sm_customers:
          object: public.sm_customers

  # Validate Primary Key tables (source PK, not _sling_row_id)
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.tables_config
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND table_model = 'PRIMARY_KEYS'
    into: pk_count

  - type: log
    message: "PK constraints found: {store.pk_count[0].cnt}"

  - type: check
    check: int_parse(store.pk_count[0].cnt) == 5
    message: "Expected 5 Primary Key tables, got {store.pk_count[0].cnt}"

  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND column_name = '_sling_row_id'
    into: row_id_count

  - type: check
    check: int_parse(store.row_id_count[0].cnt) == 0
    message: "Expected no _sling_row_id columns, got {store.row_id_count[0].cnt}"

  # Validate row counts
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT
        (SELECT count(*) FROM public.sm_categories) +
        (SELECT count(*) FROM public.sm_customers) +
        (SELECT count(*) FROM public.sm_products) +
        (SELECT count(*) FROM public.sm_orders) +
        (SELECT count(*) FROM public.sm_order_items) as cnt
    into: row_count

  - type: check
    check: int_parse(store.row_count[0].cnt) == 10
    message: "Expected 10 rows in total, got {store.row_count[0].cnt}"

  # Validate explicit identity values are kept
  - type: query
    connection: '{env.TARGET}'
    query: SELECT min(order_id) as min_id, max(order_id) as max_id FROM public.sm_orders
    into: order_ids

  - type: check
    check: int_parse(store.order_ids[0].min_id) == 1000 && int_parse(store.order_ids[0].max_id) == 1010
    message: "Expected order_id 1000..1010, got {store.order_ids[0].min_id}..{store.order_ids[0].max_id}"

  # Validate auto-increment columns (StarRocks shows AUTO_INCREMENT in SHOW CREATE TABLE)
  - type: query
    connection: '{env.TARGET}'
    query: SHOW CREATE TABLE public.sm_orders
    into: orders_ddl

  - type: log
    message: 'Orders DDL: {store.orders_ddl[0]["create table"]}'

  - type: check
    check: contains(store.orders_ddl[0]["create table"], "AUTO_INCREMENT")
    message: "Expected AUTO_INCREMENT on sm_orders.order_id"

  - type: log
    message: "Identity columns found: sm_orders.order_id"

  # Validate NOT NULL columns (excluding PK columns, which StarRocks forces NOT NULL)
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND is_nullable = 'NO' AND column_key != 'PRI'
    into: not_null_count

  - type: log
    message: "Non-nullable columns found: {store.not_null_count[0].cnt}"

  - type: check
    check: int_parse(store.not_null_count[0].cnt) >= 7
    message: "Expected at least 7 NOT NULL columns, got {store.not_null_count[0].cnt}"

  # Validate default values
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT concat(table_name, '.', column_name, '=', column_default) as col_default
      FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND column_default IS NOT NULL
      ORDER BY table_name, column_name
    into: defaults

  - type: log
    message: "Default values found: {pretty_table(store.defaults)}"

  - type: check
    check: length(store.defaults) >= 8
    message: "Expected at least 8 default values, got {length(store.defaults)}"

  - type: check
    check: contains(join(pluck(store.defaults, "col_default"), ","), "sm_orders.status=pending")
    message: "Expected default 'pending' on sm_orders.status"

  # Validate indexes (single-column bitmap indexes)
  - type: query
    connection: '{env.TARGET}'
    query: SHOW INDEX FROM public.sm_products
    into: product_indexes

  - type: query
    connection: '{env.TARGET}'
    query: SHOW INDEX FROM public.sm_orders
    into: order_indexes

  - type: log
    message: "Indexes found: {length(store.product_indexes) + length(store.order_indexes)}"

  - type: check
    check: length(store.product_indexes) >= 1 && length(store.order_indexes) >= 1
    message: "Expected bitmap indexes on sm_products and sm_orders"

  # Validate foreign keys (table property)
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.tables_config
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND properties LIKE '%foreign_key_constraints%'
    into: fk_count

  - type: log
    message: "FK constraints found: {store.fk_count[0].cnt}"

  - type: check
    check: int_parse(store.fk_count[0].cnt) == 3
    message: "Expected 3 tables with foreign keys, got {store.fk_count[0].cnt}"

  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT properties FROM information_schema.tables_config
      WHERE table_schema = 'public' AND table_name = 'sm_order_items'
    into: items_props

  - type: check
    check: contains(store.items_props[0].properties, "sm_orders") && contains(store.items_props[0].properties, "sm_products")
    message: "Expected both foreign keys on sm_order_items, got {store.items_props[0].properties}"

  # Validate column descriptions
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND column_comment != ''
    into: desc_count

  - type: log
    message: "Column descriptions found: {store.desc_count[0].cnt}"

  - type: check
    check: int_parse(store.desc_count[0].cnt) >= 3
    message: "Expected at least 3 column descriptions, got {store.desc_count[0].cnt}"

  # Validate table descriptions
  - type: query
    connection: '{env.TARGET}'
    query: |
      SELECT count(*) as cnt FROM information_schema.tables
      WHERE table_schema = 'public' AND table_name LIKE 'sm_%' AND table_comment != ''
    into: table_desc_count

  - type: log
    message: "Table descriptions found: {store.table_desc_count[0].cnt}"

  - type: check
    check: int_parse(store.table_desc_count[0].cnt) >= 2
    message: "Expected at least 2 table descriptions, got {store.table_desc_count[0].cnt}"

  # Clean up target
  - type: query
    connection: '{env.TARGET}'
    query: |
      DROP TABLE IF EXISTS public.sm_order_items;
      DROP TABLE IF EXISTS public.sm_orders;
      DROP TABLE IF EXISTS public.sm_products;
      DROP TABLE IF EXISTS public.sm_customers;
      DROP TABLE IF EXISTS public.sm_categories;

  # Clean up source
  - type: query
    connection: '{env.SOURCE}'
    query: |
      DROP TABLE IF EXISTS public.sm_order_items CASCADE;
      DROP TABLE IF EXISTS public.sm_orders CASCADE;
      DROP TABLE IF EXISTS public.sm_products CASCADE;
      DROP TABLE IF EXISTS public.sm_customers CASCADE;
      DROP TABLE IF EXISTS public.sm_categories CASCADE;
