# MySQL VARCHAR values reach the transform engine as []byte after the first
# SampleSize (900) rows. A string comparison on []byte is false, so rows
# after the sample load wrong values with no error.
source: MYSQL
target: POSTGRES

defaults:
  mode: full-refresh

hooks:
  start:
    - type: query
      connection: '{source.name}'
      query: |
        DROP TABLE IF EXISTS mysql.varchar_bytes_test;
        CREATE TABLE mysql.varchar_bytes_test (
          id INT PRIMARY KEY,
          name VARCHAR(20)
        );
        INSERT INTO mysql.varchar_bytes_test (id, name)
        WITH RECURSIVE seq(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM seq WHERE n < 1000)
        SELECT n, 'alice' FROM seq;

  end:
    - type: query
      connection: '{target.name}'
      query: |
        select
          sum(case when flag = 'Y' then 1 else 0 end) as y_cnt,
          sum(case when flag = 'N' then 1 else 0 end) as n_cnt,
          min(case when flag = 'N' then id end) as first_wrong_id
        from public.varchar_bytes_test
      into: result

    - type: log
      message: 'varchar bytes result: {store.result}'

    - type: query
      connection: '{source.name}'
      query: DROP TABLE IF EXISTS mysql.varchar_bytes_test

    - type: query
      connection: '{target.name}'
      query: DROP TABLE IF EXISTS public.varchar_bytes_test

    - type: check
      check: int_parse(store.result[0].y_cnt) == 1000
      failure_message: "BUG: string comparison wrong after row 900 (see first_wrong_id)"
      success_message: "string comparison correct for all 1000 rows"

streams:
  mysql.varchar_bytes_test:
    object: public.varchar_bytes_test
    transforms:
      - flag: 'record.name == "alice" ? "Y" : "N"'
