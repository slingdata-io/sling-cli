# issue #785: ADBC ingestion drops the catalog (database) part of the target name.
# The temp table is created in the target database, but the ADBC ingest looks for
# it in the connection's default database, so it fails with "Invalid object name".

source: LOCAL
target: MSSQL_ADBC

defaults:
  mode: full-refresh

hooks:
  start:
    - type: query
      connection: '{target.name}'
      query: IF DB_ID('slingdb785') IS NULL CREATE DATABASE slingdb785

    - type: write
      content: |
        id,name,value
        1,alice,100.5
        2,bob,200.75
        3,charlie,300.25
      to: file:///tmp/r.102.adbc_three_part_name.csv

  end:
    - type: check
      check: execution.status.error == 0
      on_failure: break

    - type: query
      connection: '{target.name}'
      query: select * from slingdb785.dbo.adbc_three_part order by id
      into: result

    - type: log
      message: "Query result: {store.result}"

    - type: check
      check: int_parse(store.result[0].id) == 1
      message: "Expected first row id to be 1"

    - type: check
      check: store.result[0].name == "alice"
      message: "Expected first row name to be alice"

    - type: check
      check: int_parse(store.result[2].id) == 3
      message: "Expected 3 rows loaded into the non-default database"

    - type: query
      connection: '{target.name}'
      query: drop table slingdb785.dbo.adbc_three_part

    - type: log
      message: "SUCCESS: ADBC loaded into a 3-part (database.schema.table) target name"

streams:
  file:///tmp/r.102.adbc_three_part_name.csv:
    object: 'slingdb785.dbo.adbc_three_part'
