# arrow lane CLI suite case 752: use_bulk false
#
# env: SOURCE, SCHEMA, KEEP_TARGET (all set by the suite entry in
# tests/suite.cli.arrow.yaml). The target is a local Parquet file: the case
# falls back to the row path, and the ADBC bulk ingest on Postgres rejects the
# type matrix (smallint, jsonb), so a DB target would fail on that adjacent
# defect rather than on the lane.
source: '{SOURCE}'
target: LOCAL

defaults:
  mode: full-refresh
  target_options:
    format: parquet
    use_bulk: false

hooks:
  end:
    - type: command
      if: 'env.KEEP_TARGET == "false"'
      command: 'rm -f /tmp/arrow_lane_752.parquet'

streams:
  '{SCHEMA}.arrow_src':
    object: 'file:///tmp/arrow_lane_752.parquet'

env:
  SOURCE: ${SOURCE}
  SCHEMA: ${SCHEMA}
