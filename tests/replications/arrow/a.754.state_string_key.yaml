# arrow lane CLI suite case 754: incremental state on a string update key
#
# env: SOURCE, TARGET, SCHEMA, KEEP_TARGET (all set by the suite entry in
# tests/suite.cli.arrow.yaml). The lane tracks the maximum of a string key
# with its own loop (RecordStream.MaxString), and the state serializer reads
# Stats.MaxStr. The end hook drops this case's target table unless the entry
# sets KEEP_TARGET=true so that verify.yaml can compare it.
source: '{SOURCE}'
target: '{TARGET}'

defaults:
  mode: incremental

hooks:
  end:
    - type: query
      if: 'env.KEEP_TARGET == "false"'
      connection: '{TARGET}'
      query: 'drop table if exists {SCHEMA}.arrow_dst_754'

streams:
  '{SCHEMA}.arrow_src':
    object: '{SCHEMA}.arrow_dst_754'
    update_key: c_str

env:
  SOURCE: ${SOURCE}
  TARGET: ${TARGET}
  SCHEMA: ${SCHEMA}
