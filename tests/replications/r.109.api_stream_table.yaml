# {stream_table} must resolve to the API endpoint name (users),
# not stay literal in the DuckDB temp table.

source: MOCK_API
target: DUCK_API_STREAM

defaults:
  mode: full-refresh
  object: main.{stream_table}

hooks:
  start:
    - type: query
      connection: '{target.name}'
      query: DROP TABLE IF EXISTS main.users

  end:
    - type: query
      connection: '{target.name}'
      query: SELECT count(*) AS n FROM main.users
      into: result

    - type: check
      check: store.result[0].n > 0

    - type: log
      message: 'SUCCESS: API {stream_table} rendered to users ({store.result[0].n} rows)'

streams:
  users: {}
