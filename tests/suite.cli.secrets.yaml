# Secret manager references (core/secrets). All tests are hermetic:
# they use the `file` and `exec` backends only.

- id: 793
  name: 'secret refs: sqlite instance from ref+file, data keeps the reference'
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' "$HOME_DIR/secret_793.db" > "$HOME_DIR/instance.txt"
    printf '%s\n' 'connections:' '  SECRET_SQLITE:' '    type: sqlite' "    instance: ref+file://$HOME_DIR/instance.txt" > "$HOME_DIR/env.yaml"
    sling conns exec --home-dir "$HOME_DIR" SECRET_SQLITE "select 'secret_793_ok' as res"
    sling conns list --home-dir "$HOME_DIR"
    test -f "$HOME_DIR/secret_793.db" && echo 'db file created'
  output_contains:
    - 'secret_793_ok'
    - 'SECRET_SQLITE'
    - 'db file created'

- id: 794
  name: 'secret refs: from ref+exec with a JSON object'
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' 'connections:' '  SECRET_DUCK:' '    type: duckdb' '    from: ref+exec://echo?arg=%7B%22instance%22%3A%22'"$HOME_DIR"'%2Fsecret_794.duckdb%22%7D' > "$HOME_DIR/env.yaml"
    sling conns exec --home-dir "$HOME_DIR" SECRET_DUCK "select 'secret_794_ok' as res"
  output_contains:
    - 'secret_794_ok'

- id: 795
  name: 'secret refs: a missing file fails and names the reference'
  err: true
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' 'connections:' '  SECRET_BAD:' '    type: sqlite' '    instance: ref+file:///no/such/secret_795.txt' > "$HOME_DIR/env.yaml"
    sling conns test --home-dir "$HOME_DIR" SECRET_BAD
  output_contains:
    - 'could not resolve secret reference "ref+file:///no/such/secret_795.txt"'

- id: 796
  name: 'secret refs: pipeline env ref, secret() function, value redacted in logs'
  run: 'sling run -p tests/pipelines/p.55.secret_refs.yaml'
  output_contains:
    - 'token is ***'
    - 'secret checks passed'
  output_does_not_contain:
    - 'token is pipeline-secret-793'

- id: 798
  name: 'secret refs: ref+sling reads connection fields, a from: copy and env vars'
  run: |
    export ENV_YAML='connections:
      SREF_PG_798: {type: postgres, host: host-798, user: u, password: "ref+exec://echo?arg=pw-798", database: db}
      SREF_COPY_798: {type: postgres, from: "ref+sling://connections/sref_pg_798", database: other}'
    SREF_KEY_798=env-val-798 sling run -p tests/pipelines/p.56.sling_refs.yaml
  output_contains:
    - 'host is ***'
    - 'sling ref checks passed'
  output_does_not_contain:
    - 'host is host-798'

- id: 803
  name: 'secret refs: from with no type, the type comes from the secret at run time'
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' 'connections:' '  LAZY_DUCK:' '    from: ref+exec://echo?arg=%7B%22type%22%3A%22duckdb%22%2C%22instance%22%3A%22'"$HOME_DIR"'%2Flazy_799.duckdb%22%7D' > "$HOME_DIR/env.yaml"
    printf '%s\n' 'source: LAZY_DUCK' 'target: LOCAL' 'streams:' '  src:' "    sql: select 'lazy_799_ok' as res" "    object: file://$HOME_DIR/out.csv" '    mode: full-refresh' > "$HOME_DIR/r.yaml"
    sling conns list --home-dir "$HOME_DIR" | grep LAZY_DUCK
    SLING_HOME_DIR="$HOME_DIR" sling run -r "$HOME_DIR/r.yaml"
    cat "$HOME_DIR/out.csv"
  output_contains:
    - 'Unknown'
    - 'lazy_799_ok'

- id: 808
  name: 'secret refs: only values of secret keys are redacted'
  run: 'sling run -p tests/pipelines/p.58.secret_keys.yaml'
  output_contains:
    - 'database is odoo-db-808'
    - 'password is ***'
    - 'url is ***'
    - 'secret key checks passed'
  output_does_not_contain:
    - 'odoo-pass-808'
    - 'odoo-808.example.com'
