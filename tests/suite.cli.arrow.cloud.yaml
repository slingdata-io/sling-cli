# Arrow lane CLI suite (cloud): tests/suite.cli.arrow.cloud.yaml
#
# Manual suite. These entries need cloud resources that are not part of the
# default test environment:
#   721 Databricks: the ADBC/zerobus ingest needs a valid UC token, and the
#       staged path needs a Unity Catalog volume.
#   722 Redshift: needs a live cluster and an S3 bucket for the staged COPY.
#
# Run it with:
#   cd cmd/sling && go build . && SLING_ROW_CNT=10000 \
#     ./sling test -s ../../tests/suite.cli.arrow.cloud.yaml -f
#
# The default suite (tests/suite.cli.arrow.yaml) keeps only the entries that
# run against the local stack: Postgres ADBC, DuckDB ADBC, MySQL, Snowflake
# (the stage is created on demand) and the local file system.

- id: 721
  name: 'arrow lane: staged Parquet on Databricks'
  group: arrow
  env:
    SOURCE: 'POSTGRES_ADBC'
    TARGET: 'DATABRICKS'
    SCHEMA: 'public'
  rows: 10000
  run: |
    SLING_ROW_CNT=10000 sling run -p tests/pipelines/arrow/seed.yaml
    sling run -d --src-conn "$SOURCE" --src-stream "$SCHEMA.arrow_src" --tgt-conn "$TARGET" --tgt-object "$SCHEMA.arrow_dst_701" --mode full-refresh
    SLING_ROW_CNT= sling conns exec "$TARGET" "drop table if exists $SCHEMA.arrow_dst_701"
  output_contains:
    - 'arrow lane: enabled'
  output_does_not_contain:
    - 'falling back to row-based'

- id: 722
  name: 'arrow lane: staged Parquet on Redshift'
  group: arrow
  env:
    SOURCE: 'POSTGRES_ADBC'
    TARGET: 'REDSHIFT'
