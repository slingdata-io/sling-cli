- id: 733
  name: 'arrow lane declines: Snowflake NUMBER scale 0 source'
  group: arrow
  env:
    SOURCE: 'SNOWFLAKE'
    TARGET: 'POSTGRES_ADBC'
    SCHEMA: 'public'
  rows: 10000
  # Step 2 seeds Snowflake through the lane: the row path cannot (REAL cannot
  # hold the float extremes, DuckDB's csv bridge mis-sniffs c_float as
  # DECIMAL, and the Snowflake insert rejects the values). Step 3 reads it
  # back as an ADBC source: Snowflake reports NUMBER(38,0) as decimal128(38,0)
  # while the lane derives decimal(38,6) for a scale-0 column, so stage 2
  # declines on the scale gap instead of writing a lossy column.
  #
  # Left in the manual suite because the row path that follows the decline
  # reads the Snowflake table as 0 rows today (measured 2026-09-23), which
  # trips the suite's row-count check. The lane's own behavior - engage on the
  # write, decline on the read - is verified.
  run: |
    SOURCE=POSTGRES_ADBC SLING_ROW_CNT=10000 sling run -p tests/pipelines/arrow/seed.yaml
    SLING_ROW_CNT= sling conns exec SNOWFLAKE "drop table if exists PUBLIC.arrow_src"
    SLING_ROW_CNT=10000 sling run -d --src-conn POSTGRES_ADBC --src-stream "$SCHEMA.arrow_src" --tgt-conn SNOWFLAKE --tgt-object PUBLIC.arrow_src --mode full-refresh
    SLING_USE_ADBC=true sling run -d --src-conn "$SOURCE" --src-stream "$SCHEMA.arrow_src" --tgt-conn "$TARGET" --tgt-object "$SCHEMA.arrow_dst_701" --mode full-refresh
    SLING_ROW_CNT= sling conns exec "$TARGET" "drop table if exists $SCHEMA.arrow_dst_701"
    SLING_ROW_CNT= sling conns exec SNOWFLAKE "drop table if exists PUBLIC.arrow_src"
  output_contains:
    - 'arrow lane: enabled'
    - 'cannot cast'
  output_does_not_contain:
    - 'falling back to row-based'

