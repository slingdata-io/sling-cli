- id: 707
  name: 'arrow lane: where filter'
  group: arrow
  env:
    SOURCE: 'POSTGRES_ADBC'
    TARGET: 'POSTGRES_ADBC'
    SCHEMA: 'public'
  # 5000, not 4999: the seed sets c_int8 to the max int64 on row 1, so the
  # filter c_int8 > 5000 matches 5001..9999 (4999 rows) plus that one row.
  # Measured on the source table: select count(*) from arrow_src where c_int8 > 5000 -> 5000
  rows: 5000
  run: |
    SLING_ROW_CNT=10000 sling run -p tests/pipelines/arrow/seed.yaml
    sling run -d --src-conn "$SOURCE" --src-stream "$SCHEMA.arrow_src" --tgt-conn "$TARGET" --tgt-object "$SCHEMA.arrow_dst_707" --mode full-refresh --where 'c_int8 > 5000'
    SLING_ROW_CNT= sling conns exec "$TARGET" "drop table if exists $SCHEMA.arrow_dst_707"
  output_contains:
    - 'arrow lane: enabled'
  output_does_not_contain:
    - 'falling back to row-based'

