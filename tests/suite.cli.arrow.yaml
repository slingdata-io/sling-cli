  run: |
    sling run -d --src-conn POSTGRES_ADBC --src-stream "select 1 as id, '{\"a\":1}'::jsonb as c_json" --tgt-conn SNOWFLAKE --tgt-object public.arrow_791 --mode full-refresh
    sling conns exec SNOWFLAKE "select 'res=' || typeof(c_json) || '|' || c_json:a::string as res from public.arrow_791"
    sling conns exec SNOWFLAKE "drop table if exists public.arrow_791"
  output_contains:
    - 'would load as a string on this target'
    - 'inserted 1 rows'
    - 'res=OBJECT|1'
  output_does_not_contain:
    - 'arrow lane: enabled'
