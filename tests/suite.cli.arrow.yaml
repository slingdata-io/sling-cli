- id: 790
  name: 'arrow lane: postgres numeric and jsonb keep their types and values'
  run: |
    sling conns exec POSTGRES "drop table if exists public.arrow_790"
    sling run -d --src-conn POSTGRES_ADBC --src-stream "select 1 as id, 12.34::numeric(10,2) as c_dec, -0.5::numeric as c_dec2, null::numeric as c_dec3, '{\"a\":1}'::jsonb as c_json" --tgt-conn POSTGRES_ADBC --tgt-object public.arrow_790 --mode full-refresh
    sling conns exec POSTGRES "select 'res=' || c_dec::text || '|' || c_dec2::text || '|' || (c_dec3 is null)::text || '|' || (c_json->>'a') || '|' || pg_typeof(c_json)::text as res from public.arrow_790"
    sling conns exec POSTGRES "drop table if exists public.arrow_790"
