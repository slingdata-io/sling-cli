# Arrow lane CLI suite: tests/suite.cli.arrow.yaml
#
# Nested suite for the Arrow-native dataflow lane (SLING_ARROW_LANE). Included
# from tests/suite.cli.yaml as `- suite: suite.cli.arrow.yaml`.
#
# Run it with:
#   cd cmd/sling && go build . && SLING_BIN=sling go test -v -run TestCLI -- --debug "700+"
#
# Groups:
#   arrow-on     701-733, 734, 735       the stream must engage the lane:
#                `arrow lane: enabled`, no `falling back to row-based`, rows.
#   arrow-off    729, 740-760, 775        the stream must fall back at info:
#                `falling back to row-based` plus the reason, no `enabled`.
#   arrow-quiet  726, 770-774             the stream must fall back at debug:
#                no info line; `arrow lane: not used` with -d.
#   arrow-force  780-783                  SLING_ARROW_LANE=force turns the
#                decline into an error (`forced but not eligible` + reason).
#   row-guard    784-791                  the row path and the column types
#                stay the same as before the lane. 789/790 run on the lane:
#                it reads the driver's numeric and jsonb labels.
#
# Every entry seeds its own source table (tests/pipelines/arrow/seed.yaml) so a
# partial range such as "770-783" is self-sufficient, and every entry shares
# `group: arrow` so the seed and the target tables never race.
#
# Environment:
#   SOURCE/TARGET/SCHEMA  per entry. Simple cases run `sling run` with flags
#     and drop their target table at the end of the entry.
#   KEEP_TARGET  set it on every entry that runs a file in
#     tests/replications/arrow. An `if` comparison against a missing env var
#     is truthy in this pipeline evaluator, so the files compare
#     `env.KEEP_TARGET == "false"`.
#   SLING_OPEN_BIN  open-build binary (no core/dbio/iop/arrow_lane..go) for
#     entries 774 and 782. Build it with the plan's phase-exit procedure and
#     point this at it; it defaults to /tmp/sling_open.
#   VERIFY_MODE  "except" | "concat" | "mssql" for tests/pipelines/arrow/verify.yaml.
#
# The arrow-off entries target a local Parquet file: they run the row path, and
# the ADBC bulk ingest on Postgres rejects the type matrix (smallint and jsonb
# COPY binary), which would fail a DB target on that adjacent defect instead of
# on the lane. Cases 743/755 expect the plan's stage-2 `cannot cast`, but this
# revision declines on any `columns:` spec, so they assert `columns is set`.
#
# The lane -> file targets (723-725) are wrapped in `timeout 300`: the lane's file
# write path currently hangs after `arrow lane: enabled (postgres -> file/file)`
# on this build, so the entry fails fast instead of blocking the whole suite.
#
# Connections: entries that need SNOWFLAKE, DATABRICKS, REDSHIFT, AWS_S3 or
# MSSQL_ADBC run only where those connections exist (same as the existing ADBC
# entries in tests/suite.cli.yaml; the harness has no skip mechanism).

- id: 701
  name: 'arrow lane: default full-refresh engages'
  group: arrow
  env:
    SOURCE: 'POSTGRES_ADBC'
    TARGET: 'POSTGRES_ADBC'
    SCHEMA: 'public'
  rows: 10000
  run: |
    SLING_ROW_CNT=10000 sling run -p tests/pipelines/arrow/seed.yaml
    sling run -d --src-conn "$SOURCE" --src-stream "$SCHEMA.arrow_src" --tgt-conn "$TARGET" --tgt-object "$SCHEMA.arrow_dst_701" --mode full-refresh
    SLING_ROW_CNT= sling conns exec "$TARGET" "drop table if exists $SCHEMA.arrow_dst_701"
  output_contains:
    - 'arrow lane: enabled'
  output_does_not_contain:
    - 'falling back to row-based'

