  group: arrow
  env:
    SOURCE: 'MYSQL'
    TARGET: 'POSTGRES_ADBC'
    # MySQL has no schema layer over databases: the seed loads into the
    # existing `mysql` database, so no schema creation is attempted there.
    SCHEMA: 'mysql'
    KEEP_TARGET: 'false'
  # the stream is one synthetic change-capture event, not the seeded table
  rows: 1
  run: |
    SLING_ROW_CNT=10000 sling run -p tests/pipelines/arrow/seed.yaml
    sling run -d -r tests/replications/arrow/a.726.cdc_group.yaml
  output_contains:
