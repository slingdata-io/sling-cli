- id: 526
  name: 'sling conns test --debug redacts password'
  err: true
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' 'connections:' '  MY_PG:' '    type: postgres' '    host: 127.0.0.1' '    port: 1' '    user: x' '    password: DistinctivePassXYZ' '    database: x' > "$HOME_DIR/env.yaml"
    sling conns test --home-dir "$HOME_DIR" --debug MY_PG
  output_contains:
    - '***'
  output_does_not_contain:
    - 'DistinctivePassXYZ'

- id: 527
  name: 'sling conns set stores argv password literal'
  run: |
    HOME_DIR=$(mktemp -d)
    sling conns set --home-dir "$HOME_DIR" MY_PG --type postgres host=localhost password=hunter2-ARGV -o text
    cat "$HOME_DIR/env.yaml"
  output_contains:
    - 'connection `MY_PG` has been set'
    - 'password: hunter2-ARGV'
