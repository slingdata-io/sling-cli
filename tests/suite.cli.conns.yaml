- id: 1
  name: 'sling conns test --debug redacts password'
  err: true
  run: |
    HOME_DIR=$(mktemp -d)
    printf '%s\n' 'connections:' '  MY_PG:' '    type: postgres' '    host: 127.0.0.1' '    port: 1' '    user: x' '    password: DistinctivePassXYZ' '    database: x' > "$HOME_DIR/env.yaml"
    sling conns test --home-dir "$HOME_DIR" --debug MY_PG
  output_contains:
    - '***'
  output_does_not_contain:
    - 'DistinctivePassXYZ'

- id: 2
  name: 'sling conns set stores argv password literal'
  run: |
    HOME_DIR=$(mktemp -d)
    sling conns set --home-dir "$HOME_DIR" MY_PG --type postgres host=localhost password=hunter2-ARGV -o text
    cat "$HOME_DIR/env.yaml"
  output_contains:
    - 'connection `MY_PG` has been set'
    - 'password: hunter2-ARGV'

- id: 3
  name: 'sling conns list with two Iceberg connections that use sql_catalog_conn'
  run: |
    DIR=$(mktemp -d)
    export ICE_A='{type: iceberg, catalog_type: sql, sql_catalog_conn: CAT_A}'
    export ICE_B='{type: iceberg, catalog_type: sql, sql_catalog_conn: CAT_B}'
    export CAT_A="sqlite://$DIR/a.db"
    export CAT_B="sqlite://$DIR/b.db"
    sling conns list
  output_contains:
    - 'ICE_A'
    - 'ICE_B'
    - 'CAT_A'
    - 'CAT_B'

- id: 4
  name: 'sling conns list loads a dbt-duckdb output with path'
  run: 'sling conns list'
  env:
    DBT_PROFILES_DIR: tests/files/dbt
  output_contains:
    - 'SHOP_DEV'
